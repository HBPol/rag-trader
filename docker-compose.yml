version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: ragtrader-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: ragtrader-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RAGTRADER_API_ENV=${RAGTRADER_API_ENV:-dev}
      - RAGTRADER_API_POSTGRES_DSN=${RAGTRADER_API_POSTGRES_DSN:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      - RAGTRADER_API_REQUIRE_DATABASE=${RAGTRADER_API_REQUIRE_DATABASE:-true}
      - RAGTRADER_API_QDRANT_URL=${RAGTRADER_API_QDRANT_URL:-${QDRANT_URL}}
      - RAGTRADER_API_QDRANT_COLLECTION=${RAGTRADER_API_QDRANT_COLLECTION:-rag-cluster}
      - RAGTRADER_API_REQUIRE_VECTOR_STORE=${RAGTRADER_API_REQUIRE_VECTOR_STORE:-true}
      - COINBASE_API_BASE=${COINBASE_API_BASE}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: ragtrader-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENV=${ENV:-dev}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
