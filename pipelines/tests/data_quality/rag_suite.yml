meta:
  great_expectations_version: "0.18"
expectation_suite_name: rag_articles_suite
expectations:
  - expectation_type: expect_table_row_count_to_be_between
    kwargs:
      min_value: 1
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: id
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: title
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: summary
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: url
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: source
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: published_ts
  - expectation_type: expect_column_values_to_match_strftime_format
    kwargs:
      column: published_ts
      strftime_format: "%Y-%m-%dT%H:%M:%S+00:00"
  - expectation_type: expect_column_values_to_be_in_set
    kwargs:
      column: coins
      value_set: ["BTC", "ETH"]
