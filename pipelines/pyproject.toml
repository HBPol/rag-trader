[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrader-pipelines"
version = "0.1.0"
description = "Batch and streaming jobs for RAGTrader"
authors = [{ name = "RAGTrader Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.26",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.2",
  "redis>=5.0",
  "scipy>=1.11",
  "sqlalchemy>=2.0",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "mypy>=1.8",
  "pandas-stubs ; python_version < \"3.12\"",
  "types-redis>=4.6.0.4",
  "great-expectations>=0.18,<0.19",
]

data-quality = [
  "great-expectations>=0.18,<0.19",
  "pyarrow>=14.0.1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=ragtrader_pipelines --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "Q", "S", "I"]
ignore = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ragtrader_api", "ragtrader_pipelines", "api"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ragtrader_pipelines"]
mypy_path = ["src", "../api/src"]

[[tool.mypy.overrides]]
module = [
  "sqlalchemy",
  "sqlalchemy.*",
  "alembic",
  "alembic.*",
  "httpx",
  "qdrant_client",
  "pandas",
  "pandas.*",
  "networkx",
  "networkx.*",
  "statsmodels",
  "statsmodels.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["ragtrader_api.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["ragtrader_pipelines"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ragtrader_pipelines = ["py.typed"]
