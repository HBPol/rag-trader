version: "3.9"

services:
  qdrant:
    build:
      context: .
      dockerfile: docker/qdrant/Dockerfile
    container_name: ragtrader-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    environment:
      - RAGTRADER_API_QDRANT_URL=http://qdrant:6333

volumes:
  qdrantdata:
