version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: ragtrader-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    environment:
      - RAGTRADER_API_QDRANT_URL=http://qdrant:6333

volumes:
  qdrantdata:
