[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtrader-api"
version = "0.1.0"
description = "API service for the RAGTrader platform"
authors = [{ name = "RAGTrader Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=4.1",
  "ruff>=0.3",
  "black>=24.2",
  "isort>=5.13",
  "mypy>=1.8",
  "httpx>=0.26",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
src = ["src", "tests"]
select = ["E", "F", "I", "UP", "B", "Q", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ragtrader_api"]

[tool.coverage.run]
branch = true
source = ["ragtrader_api"]
