repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (api)
        entry: python -m mypy --config-file=api/pyproject.toml
        language: python
        additional_dependencies:
          - mypy==1.8.0
          - ./api[dev]
          - ./pipelines[dev]
        pass_filenames: false
      - id: mypy-pipelines
        name: mypy (pipelines)
        entry: python -m mypy --config-file=pipelines/pyproject.toml
        language: python
        additional_dependencies:
          - mypy==1.8.0
          - ./api[dev]
          - ./pipelines[dev]
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: eslint (web)
        files: ^web/.*\.(ts|tsx|js|jsx)$
        types_or: ["ts", "tsx", "javascript", "jsx"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^web/.*\.(ts|tsx|js|jsx|json|css)$
