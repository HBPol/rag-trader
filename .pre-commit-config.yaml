repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: ["--fix"]
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (api)
        entry: python -m mypy --config-file=api/pyproject.toml
        language: python
        env:
          PYTHONPATH: api/src:pipelines/src
        additional_dependencies:
          - mypy==1.8.0
          - fastapi>=0.110
          - pydantic-settings>=2.2
          - sqlalchemy>=2.0
          - alembic>=1.13
          - psycopg[binary]>=3.1
          - uvicorn>=0.29
          - qdrant-client>=1.9
          - tenacity>=8.2
          - pytest>=8.0
          - httpx>=0.26
          - testcontainers[postgresql]>=4.2
          - psycopg2-binary>=2.9
        pass_filenames: false
      - id: mypy-pipelines
        name: mypy (pipelines)
        entry: python -m mypy --config-file=pipelines/pyproject.toml
        language: python
        env:
          PYTHONPATH: api/src:pipelines/src
        additional_dependencies:
          - mypy==1.8.0
          - pandas>=2.2
          - httpx>=0.26
          - sqlalchemy>=2.0
          - fastapi>=0.110
          - pydantic-settings>=2.2
          - alembic>=1.13
          - psycopg[binary]>=3.1
          - uvicorn>=0.29
          - qdrant-client>=1.9
          - tenacity>=8.2
          - pytest>=8.0
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: eslint (web)
        files: ^web/.*\.(ts|tsx|js|jsx)$
        types_or: ["ts", "tsx", "javascript", "jsx"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^web/.*\.(ts|tsx|js|jsx|json|css)$
