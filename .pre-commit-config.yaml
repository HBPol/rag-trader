repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.5
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        args: ["--check"]
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (api)
        entry: tools/precommit/mypy_api.sh
        language: system
        pass_filenames: false
      - id: mypy-pipelines
        name: mypy (pipelines)
        entry: tools/precommit/mypy_pipelines.sh
        language: system
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        name: eslint (web)
        files: ^web/.*\.(ts|tsx|js|jsx)$
        types_or: ["ts", "tsx", "javascript", "jsx"]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: prettier (web)
        files: ^web/.*\.(ts|tsx|js|jsx|json|css)$
