name: Monorepo CI

on:
  push:
    branches:
      - master
      - develop
#      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  workflow-guardrails:
    name: Workflow Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate CI workflow definition
        run: pytest tests/test_ci_workflow.py

  reachability:
    name: External Reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: pip install requests

      - name: Run reachability probes
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          REACHABILITY_RSS_FEEDS: ${{ secrets.REACHABILITY_RSS_FEEDS }}
          REACHABILITY_SKIP_QDRANT: ${{ secrets.REACHABILITY_SKIP_QDRANT }}
          RSS_BASIC_AUTH: ${{ secrets.RSS_BASIC_AUTH }}
        run: python tools/reachability.py

  python-quality:
    name: Python Quality (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: api
            cov_package: ragtrader_api
          - package: pipelines
            cov_package: ragtrader_pipelines
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/pyproject.toml
            pipelines/pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: mypy
        working-directory: .
        run: >-
          if [[ "${{ matrix.package }}" == 'api' ]]; then
            tools/precommit/mypy_api.sh;
          else
            tools/precommit/mypy_pipelines.sh;
          fi

      - name: Coinbase ingestion unit tests
        if: ${{ matrix.package == 'pipelines' }}
        run: pytest --no-cov tests/test_coinbase_ingestion.py

      - name: Pytest with coverage gate
        env:
          PYTHONPATH: src
        run: >-
          pytest --cov=${{ matrix.cov_package }} --cov-report=xml
          --cov-report=term --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.4.1
        with:
          files: ./${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          cli-version: latest

  node-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Vitest with coverage gate
        run: pnpm test -- --coverage

      - name: Build Next.js app
        run: pnpm build

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-next-build
          path: .next
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4.4.1
        with:
          files: ./web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          cli-version: latest

  compose-smoke:
    name: Compose Smoke Tests
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - node-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Compose smoke tests
        env:
          API_PORT: "18080"
          WEB_PORT: "15173"
          POSTGRES_PORT: "15432"
          RAGTRADER_API_USE_QDRANT_CLOUD: "false"
        run: pytest tests/test_compose.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - node-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t ragtrader-api:ci -f api/Dockerfile .

      - name: Build Web image
        # The web Dockerfile copies package.json from the build context, so we
        # must keep the context rooted at web/ instead of the repository root.
        run: docker build -t ragtrader-web:ci -f web/Dockerfile web

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs:
      - node-quality
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Download web build artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-next-build
          path: web

      - name: Lighthouse CI audit
        run: pnpm lhci || pnpm lhci

      - name: Upload Lighthouse CI artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-web
          path: web/.lighthouseci
