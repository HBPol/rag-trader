name: Monorepo CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  workflow-guardrails:
    name: Workflow Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate CI workflow definition
        run: pytest tests/test_ci_workflow.py

  reachability:
    name: External Reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: pip install requests

      - name: Run reachability probes
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          REACHABILITY_RSS_FEEDS: ${{ secrets.REACHABILITY_RSS_FEEDS }}
          REACHABILITY_SKIP_QDRANT: ${{ secrets.REACHABILITY_SKIP_QDRANT }}
          RSS_BASIC_AUTH: ${{ secrets.RSS_BASIC_AUTH }}
        run: python tools/reachability.py

  python-quality:
    name: Python Quality (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: api
            cov_package: ragtrader_api
          - package: pipelines
            cov_package: ragtrader_pipelines
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            api/pyproject.toml
            pipelines/pyproject.toml

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: isort
        run: isort --check-only .

      - name: mypy
        run: mypy

      - name: Coinbase ingestion unit tests
        if: ${{ matrix.package == 'pipelines' }}
        run: pytest tests/test_coinbase_ingestion.py

      - name: Pytest with coverage gate
        env:
          PYTHONPATH: src
        run: >-
          pytest --cov=${{ matrix.cov_package }} --cov-report=xml
          --cov-report=term --cov-fail-under=80

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  node-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: ESLint
        run: pnpm lint

      - name: TypeScript type check
        run: pnpm exec tsc --noEmit

      - name: Vitest with coverage gate
        run: pnpm test -- --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./web/coverage/lcov.info
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  compose-smoke:
    name: Compose Smoke Tests
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - node-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Compose smoke tests
        env:
          API_PORT: "18080"
          WEB_PORT: "15173"
          POSTGRES_PORT: "15432"
          RAGTRADER_API_USE_QDRANT_CLOUD: "false"
        run: pytest tests/test_compose.py

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - python-quality
      - node-quality
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t ragtrader-api:ci -f api/Dockerfile api

      - name: Build Web image
        run: docker build -t ragtrader-web:ci -f web/Dockerfile web
